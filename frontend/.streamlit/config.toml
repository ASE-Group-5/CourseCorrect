[theme]
base = "light"
primaryColor = "#2E5BFF"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#EAEFFA"
textColor = "#1B2333"
linkColor = "#2E5BFF"
borderColor = "#D5DCEB"
showWidgetBorder = true

# Bigger text everywhere: the default root size is 16px.
baseFontSize = 18
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600]
baseRadius = "medium"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F4FB"

[server]
headless = true
